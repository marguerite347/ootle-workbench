name: Ootle validation
on:
  push:
    branches: [ootle, feat/connected-agents, fix/security-audit]
  pull_request:
    branches: [ootle]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ootle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ide:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --ignore-engines --non-interactive --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm ci --prefix tools/agent-service --ignore-scripts
      - run: npm test --prefix tools/agent-service
      - run: node --test tools/catalog/fronts.test.mjs tools/tari-companion/server.test.mjs tools/security/regression.test.mjs tools/security/browser-dependencies.test.mjs tools/security/rust-audit-gate.test.mjs
      - run: node tools/security/template-parity.mjs
      - run: yarn build:libs
        env:
          NX_NO_CLOUD: 'true'
          NX_DAEMON: 'false'
      - run: yarn build:production
        env:
          ANALYZE: security
      - run: node tools/security/dependency-paths.mjs --require-bundle
      - run: node tools/package-web.mjs
        env:
          OOTLE_AGENT_SERVICE_URL: https://ootle-workbench-agents.vercel.app
      - run: node tools/security/verify-web-artifacts.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: ootle-workbench-web-${{ github.sha }}
          path: dist/apps/remix-ide
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: node-exposure-${{ github.sha }}
          path: reports/security/dependency-paths.json
          retention-days: 30
  tari:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-02 toolchain catalog
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - run: cargo test --locked --manifest-path templates/tari-counter/Cargo.toml
      - run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path templates/tari-counter/Cargo.toml
      - run: cargo test --locked --manifest-path examples/ootle-counter-remix/Cargo.toml
      - run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path examples/ootle-counter-remix/Cargo.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - run: node tools/tari-companion/smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: tari-counter-wasm-${{ github.sha }}
          path: templates/tari-counter/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: starter
            lockfile: templates/tari-counter/Cargo.lock
          - name: remix-example
            lockfile: examples/ootle-counter-remix/Cargo.lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-02 toolchain catalog
        with:
          toolchain: '1.99.1'
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file ${{ matrix.lockfile }} --json > rust-audit.json
      - run: node tools/security/rust-audit-gate.mjs rust-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'push'
        with:
          name: rust-advisories-${{ matrix.name }}-${{ github.sha }}
          path: rust-audit.json
          retention-days: 30
